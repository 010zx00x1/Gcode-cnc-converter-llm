version: '3.9'

services:
  backend:
    build: ./backend
    container_name: cnc-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data   # persiste llm_config.json
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cnc-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
